{% extends 'recipes/base.html' %}

{% block content %}
    <p>Add a new recipe:</p>
    <!--action argument tells browser where to send the data submitted in the form.-->
    <!--method argument tells browser to submit the data as a POST request-->
    <form action="{% url 'recipes:new_recipe' %}" method="post" class="mt-3">
        {% csrf_token %}

        <!-- Manually render form fields to ensure proper Bootstrap styling -->
        <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
            {{ form.name }}
        </div>

        <div class="mb-3">
            <label for="{{ form.cooking_time_hours.id_for_label }}" class="form-label">{{ form.cooking_time_hours.label }}</label>
            {{ form.cooking_time_hours }}
        </div>

        <div class="mb-3">
            <label for="{{ form.cooking_time_minutes.id_for_label }}" class="form-label">{{ form.cooking_time_minutes.label }}</label>
            {{ form.cooking_time_minutes }}
        </div>

        <div class="mb-3">
            <label for="{{ form.category.id_for_label }}" class="form-label">{{ form.category.label }}</label>
            {{ form.category }}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Add Recipe</button>
    </form>
{% endblock content %}
